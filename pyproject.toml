[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-recommender"
version = "0.1.0"
description = "Scenario-based ad recommendation engine with deterministic compliance safety boundary (CS5351)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
