# CS5351 阻塞门禁（D7）— 课程 §6 六道门禁的实现
#
# 设计说明见 README「阻塞门禁设计」一节与 docs/branch-protection.md。
#
# 门禁 → 步骤映射：
#   门禁 3 Schema            → Job「Schema gate」
#   门禁 2 Static analysis   → Job「Static analysis gates」（ruff / mypy / 依赖 / 安全路径）
#   门禁 5 Regression        → Job「Regression gate」
#   门禁 6 AI-use log        → Job「AI-use log gate」
#   门禁 1 Test approval     → Job「Test approval gate」
#   门禁 4 Semantic eval     → Job「Semantic evaluation gate」（当前为占位，见该 step 说明）
#   （附加）架构 fitness function → Job「Architecture fitness functions」（课程 Tier 1 要求）
#
# 门禁 4 与门禁 1 的受限状态在本文件内**显式声明**，不伪装为已完全满足。

name: blocking-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  # 受限环境下无法在仓库内写缓存；显式指向 runner 临时目录
  RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
  MYPY_CACHE_DIR: ${{ runner.temp }}/mypy-cache

jobs:
  # =========================================================================
  # 门禁 3：需求注册表必须通过其 JSON Schema
  # =========================================================================
  schema-gate:
    name: "Gate 3 · Schema (requirements registry)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate requirements registry against req-schema.json
        run: python scripts/validate_requirements.py

  # =========================================================================
  # 门禁 2：lint / 类型检查 / 依赖检查；
  #         触及 safety-relevant paths 的 PR 额外跑 contract / security /
  #         API-surface / permission 检查（本项目以结构 fitness function +
  #         安全路径检查实现后四项）
  # =========================================================================
  static-analysis:
    name: "Gate 2 · Static analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src test scripts eval
      - name: Type check (mypy)
        run: mypy
      - name: Dependency check (declared vs used)
        run: python scripts/check_dependencies.py
      - name: Delivery completeness (disk has it ≠ repo has it)
        # BUG-008：`src/audit/` 曾因 `.gitignore` 的 `audit/` 模式从未入库，
        # 而当时所有检查都只读磁盘、全部通过。本步骤补上"交付完整性"。
        run: python scripts/check_repo_completeness.py
      - name: Safety-relevant path check (permission + accompanying ADR)
        run: python scripts/check_safety_paths.py --base origin/${{ github.base_ref || 'main' }}
      - name: Structural / architecture fitness functions
        run: python scripts/fitness_functions.py

  # =========================================================================
  # 门禁 5：每次变更跑全部历史测试套件，任何回归即阻塞
  # =========================================================================
  regression:
    name: "Gate 5 · Regression (full offline suite)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline test suite (no live API calls)
        run: pytest test/offline -q
      - name: Implementation ↔ requirements consistency audit
        run: python scripts/audit_implementation.py

  # =========================================================================
  # 门禁 5（补充）：变异验证 —— 证明"反例测试"真的会失败
  #
  # INV-ADS-011 要求每条不变量有一个"在违规时确实会失败"的测试。
  # `scripts/mutation_check.py` 对 13 条不变量各注入一条违规（内存中，不改源文件），
  # 断言其测试确实失败。**若某条注入违规后测试仍全绿，则该反例不具备证伪能力。**
  #
  # 这是 P7 的产物：它第一次运行时抓到了 4 条"装饰性反例"（假通过）。
  # =========================================================================
  mutation-verification:
    name: "Gate 5b · Mutation verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Each declared invariant's counterexample test actually fails when broken
        run: python scripts/mutation_check.py

  # =========================================================================
  # 门禁 6：改代码或 prompt 却未更新 AI-use 日志 → 阻塞
  # =========================================================================
  ai-use-log-gate:
    name: "Gate 6 · AI-use log"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: AI-use log updated in the same change set
        run: python scripts/check_ai_use_log.py --base origin/${{ github.base_ref || 'main' }}

  # =========================================================================
  # 门禁 1：测试必须在实现开始前获批
  # =========================================================================
  test-approval-gate:
    name: "Gate 1 · Test approval"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests for this change were approved before implementation
        run: python scripts/check_test_approval.py --base origin/${{ github.base_ref || 'main' }}

  # =========================================================================
  # 门禁 4：prompt / model 变更须先 replay 固定评估集并过质量阈值
  #
  # 当前状态（P7 之后，**已不再是占位**）：
  #   - 固定评估集 eval/eval_cases.json **已建立**（25 条：11 MUST_PASS / 14 MUST_FAIL）
  #   - eval/eval_runner.py 可一键 replay，输出通过率 / 违规数 / p95
  #   - config.yaml 的 eval 段是本门禁阈值的**单点来源**（pass_rate 0.95）
  #   - 判定口径见 ADR-003（分母分离：MUST_FAIL 不计入通过率；违规零容忍）
  #
  # 仍需注意的限制（显式声明）：
  #   - 仓库当前**仍无 prompt 文件**（prompts/ 为空，真实 LLM 接入属 P8），
  #     故本门禁的"prompt 变更"触发条件在本仓库内尚不成立；
  #   - 判定"MUST_PASS 达成率 < 阈值"会**阻断**（fail-closed）。
  # =========================================================================
  semantic-evaluation-gate:
    name: "Gate 4 · Semantic evaluation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Replay fixed evaluation set on prompt/model change
        run: python scripts/check_semantic_eval.py --base origin/${{ github.base_ref || 'main' }}
