    priority: "must"
    fit_criterion: "超预算请求被裁剪并记录，超预算未记录数 = 0；compaction 后 standing constraints 仍在最终 prompt 中。"
    verification: ["unit_test", "metric_measurement"]
    enforced_by: "route_budget + summarization gate + re-injection"
    enforcement: ["selector（context assembly）", "config.yaml"]
    asr: true
    asr_id: "ASR-ADS-14"
