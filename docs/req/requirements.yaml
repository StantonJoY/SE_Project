  - id: "OQ-004"
    question: "confidence 阈值 0.5 是否合适，需用评估集调参确定。"
    owner: "B"
    blocks: ["REQ-ADS-NFR-SAFETY-005"]
    due_gate: "**已于 2026-10-06 关闭** —— 阈值定为 **0.5**，由 config.yaml 的 selector.confidence_threshold 单点控制。评估集落地后若显示过松/过紧则重开。"
    status: "closed"
    resolution: "阈值 = 0.5（人类决策，2026-10-06）"
  - id: "OQ-009"
    question: "「解释（reason）」的领域口径：广告推荐系统中什么算 explanation，如何评估其质量。"
    owner: "team"
    blocks: ["REQ-ADS-AI-001"]
    due_gate: "**已于 2026-10-06 关闭**"
    status: "closed"
    resolution: >-
      口径定为「**为什么选这条广告**」——即解释须说明在当前场景特征下
      选择该广告而非候选集中其他广告的理由。据此：① 解释是建议性输出，
      不得改写 ad_id；② 解释不得绕过 compliance（含违禁词复查）；
      ③ 解释质量不达标只降级解释，不影响决策（INV-ADS-004）。
  - id: "OQ-005"
    question: "评估集口径：期望广告由人工标注，还是按品类匹配判定。"
    owner: "D"
    blocks: ["REQ-ADS-NFR-QA-001", "REQ-ADS-NFR-QA-004"]
    due_gate: "**已于 2026-10-06 关闭**（随 docs/plans/P7-eval.md 批准）"
    status: "closed"
    resolution: >-
      口径 = **agent 自造标注集为主 + 人类审查后可增改**（记作「甲/混合」方案）。
      每条用例同时含：`expected`（ad | no_ad）、`expected_ad_id`（**人工标注的正确答案**，
      提供强信号，能测出同品类内选错）、`expected_category`、`basis` 与 `anchors`。
      判定通过率阈值 = **0.95**（人类指示：仅做 demo）。
      关键补充：**`FAIL` 也是一种有效观测** —— `MUST_FAIL` 用例（预期降级）**单独统计**，
      不作为阻断理由；只有 `MUST_PASS` 达成率 < 0.95 才阻断。理由：若把预期降级计入分母，
      95% 这个数会被降级用例稀释，失去意义。
  - id: "OQ-006"
    question: "成交价规则：pay-as-bid（付自己的出价）还是次价（Vickrey），V2 建议 pay-as-bid 最简。"
    owner: "B"
    blocks: ["REQ-ADS-ARCH-010"]
    due_gate: "V2 需求批准前"
  - id: "OQ-007"
    question: "最终分数公式：relevance × bid 是否够，是否需要加权（场景匹配度 × 相关性 × bid）。"
    owner: "B"
    blocks: ["REQ-ADS-FR-006"]
    due_gate: "V2 需求批准前"
  - id: "OQ-008"
    question: "V2 竞价需求是否正式并入基线（从 candidate_requirements 迁至 baseline_requirements，并启用 docs2/）。"
    owner: "team"
