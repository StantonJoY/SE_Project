# CS5351 场景化广告推荐引擎 — 机器可读需求注册表（D1）
#
# 课程格式依据：note/3. 软件架构.md 行 995–1014（示例 YAML 需求）
#   - id         语义化，ID 本身编码类别（FR / ARCH / NFR-SAFETY / SEC / GOV ...）
#   - enforced_by 扁平字符串，指向具体代码元素
# 本文件是**唯一需求单一来源**；docs/req/*-draft.md 为内容底稿（informative），冲突时以本文件为准。
# ID 一经发布不可复用、不可重编号。旧编号 REQ-001~039 的映射见 §legacy_id_map。
#
# 校验：python scripts/validate_requirements.py

schema_version: "2.0"
registry_revision: "2026-10-06.1"

project:
  name: "场景化广告推荐引擎 / Scenario-based Ad Recommendation Engine"
  course: "CS5351 Agentic Software Engineering Project"
  repository: "https://github.com/StantonJoY/SE_Project"
  baseline_version: "V1"
  target_versions: ["V1", "V2"]

# ---------------------------------------------------------------------------
# 版本轮次 ↔ 目录映射（课程 note 行 1531/1562：每轮 ADD append-only，绝不合并轮次）
# ---------------------------------------------------------------------------
evolution_rounds:
  - round: "V1"
    governs: "docs/architecture/"
    docs_dir: "docs/architecture/"
    status: "active"
    note: "B1 基线：架构工件在当前轮次目录下，AI 可改。"
  - round: "V2"
    governs: "docs2/architecture/"
    docs_dir: "docs2/architecture/"
    status: "not_started"
    note: "竞价轮次。V2 启动时 V1 层冻结（IMMUTABLE）；新条目只追加到 docs2/。"

scope:
  in:
    - "给定本地广告素材库与场景特征（时段/设备/用户标签），选出一条广告并渲染结构化结果。"
    - "LLM 在规则预筛后的候选集内做闭集选择，输出结构化 JSON（ad_id/reason/confidence）。"
    - "确定性合规过滤作为安全边界，拦截违禁词、敏感品类、场景冲突与非法输出。"
    - "全流程审计日志（JSONL），可重放每次决策。"
    - "V2（docs2/ 轮次）：报价竞价框架，LLM 降级为相关性建议，成交/花费/胜负由确定性数学代码决定。"
  out:
    - item: "RAG / 向量检索召回"
      deferred_to: "V3"
      rationale: "课程只要求至少一个真实 AI 组件；V1 用闭集 LLM 选择已满足，且无数据库约束下 RAG 成本高。"
      source_refs:
        - {source: "proposal", locator: "§2 核心流程（RAG 检索层）"}
        - {source: "req_v1_draft", locator: "§1 不做什么"}
    - item: "接入真实广告投放平台 / 实时竞价"
      deferred_to: "V3+"
      rationale: "无外部依赖约束，V1/V2 为本地离线可测系统。"
      source_refs:
        - {source: "req_v1_draft", locator: "§1 不做什么"}
    - item: "LLM 自由生成全新文案"
      deferred_to: "V3"
      rationale: "生成式文案扩大合规逃逸面；V1 只做闭集选择，安全故事更可证。"
      source_refs:
        - {source: "req_v1_draft", locator: "§1 不做什么"}
    - item: "用户画像系统 / 多轮上下文记忆"
      deferred_to: "V3"
      rationale: "V1 场景特征为无状态单轮输入，降低状态治理复杂度；对应六层上下文的 HISTORY 层不适用。"
      source_refs:
        - {source: "req_v1_draft", locator: "§1 不做什么"}
    - item: "Web 前端界面"
      deferred_to: "V3"
      rationale: "V1 渲染 = JSON/简单 HTML，课程评分权重在治理与安全边界而非 UI。"
      source_refs:
        - {source: "req_v1_draft", locator: "§1 不做什么"}

sources:
  - key: "req_v1_draft"
    path: "docs/req/requirements-v1-draft.md"
    kind: "requirement_draft"
    authority: "normative"
    note: "V1 内容底稿，已固定为 V1 基线。"
  - key: "req_v2_draft"
    path: "docs/req/requirements-v2-bidding-draft.md"
    kind: "requirement_draft"
    authority: "candidate"
    note: "V2 竞价候选需求，归属 docs2/ 轮次。"
  - key: "design_v1"
    path: "docs/design/technical-design-v1.md"
    kind: "design_draft"
    authority: "informative"
    note: "实现现状参考；其架构性内容正在迁移至 docs/architecture/。"
  - key: "proposal"
    path: "docs/req/requirements-v1-draft.md"
    kind: "proposal"
    authority: "informative"
    note: "立项提案（工作区副本 project-proposal.md）；原始范围含 RAG，已按 scope.out 后移。"
  - key: "course_spec"
    path: "Week1_Project_Requirements.pdf"
    kind: "course_spec"
    authority: "normative"
    note: "交付物 D1~D9 与 6 道阻塞门禁来源。"
  - key: "sa_lecture"
    path: "SE/note/3. 软件架构.md"
    kind: "course_spec"
    authority: "normative"
    note: "A1~A5 五动作、11 类架构工件、Capstone 评分量规；架构需求分类依据。"

# ---------------------------------------------------------------------------
# A1 产物（ASR 登记册）与 A2 产物（不变量登记册）的机器可读回指
# 一致性由 scripts/validate_requirements.py 双向校验
# ---------------------------------------------------------------------------
architecture_inputs:
  asr_register: "docs/architecture/asr-register.md"
  invariant_register: "docs/architecture/invariants.md"
  adr_dir: "docs/architecture/adr/"

# ===========================================================================
# B1 基线需求（docs/architecture/ 轮次）
# ===========================================================================
baseline_requirements:

  # ---- 功能性需求 ----
  - id: "REQ-ADS-FR-001"
    version: "V1"
    type: "functional"
    statement: "系统从本地 JSON 文件加载广告素材库。"
    priority: "must"
    fit_criterion: "加载后素材条数 = 文件条数；重复 ad_id 立即报错并终止加载。"
    verification: ["unit_test", "negative_test"]
    enforced_by: "ads.repository.AdRepository.load"
    enforcement: ["ads.repository.AdRepository.load"]
    asr: false
    legacy_id: "REQ-001"
    source_refs:
      - {source: "req_v1_draft", locator: "F1.1, REQ-001"}
      - {source: "design_v1", locator: "§3.1"}
    status: "implemented"
    notes: "AdLoadError 覆盖文件缺失/非法 JSON/顶层非数组/重复 ad_id。判为 implementation（litmus 1 维）。"

  - id: "REQ-ADS-FR-002"
    version: "V1"
    type: "functional"
    statement: "场景输入（时段/设备/用户标签）必须通过校验后才能进入推荐流程。"
    priority: "must"
    fit_criterion: "非法/缺失/多余字段的输入 100% 被拒绝并返回明确原因；合法输入被规范化为 Scene。"
    verification: ["unit_test", "negative_test", "schema_validation"]
    enforced_by: "scene.parser.parse_scene"
    enforcement: ["scene.parser.parse_scene", "scene.schema.SCENE_SCHEMA"]
    asr: false
    legacy_id: "REQ-003"
    source_refs:
      - {source: "req_v1_draft", locator: "F2.1, F2.2, REQ-003"}
      - {source: "design_v1", locator: "§3.2"}
    status: "implemented"
    notes: "判为 implementation（litmus 1 维）。user_tags 去重保序；非法输入不进入 LLM。"

  - id: "REQ-ADS-FR-003"
    version: "V1"
    type: "functional"
    statement: "无候选、LLM 失败/超时、合规全拒等场景必须降级为结构化「无广告」，系统不得崩溃。"
    priority: "must"
    fit_criterion: "上述全部降级场景返回符合 render schema 的明确结果且进程正常退出，崩溃次数 = 0。"
    verification: ["unit_test", "negative_test", "evaluation_replay"]
    enforced_by: "app.recommend（fallback path）"
    enforcement: ["app.recommend", "render"]
    asr: true
    asr_id: "ASR-ADS-09"
    invariants: ["INV-ADS-013"]
    legacy_id: "REQ-011"
    source_refs:
      - {source: "req_v1_draft", locator: "F4.5, F6.4, REQ-011"}
      - {source: "design_v1", locator: "§4.2"}
    status: "specified"
    notes: "强制 fallback path + 结构化原因码。降级一律 no_ad，不做换候选重选。"

  - id: "REQ-ADS-FR-004"
    version: "V1"
    type: "functional"
    statement: "渲染输出为结构化推荐结果，含广告形态与无广告形态两种。"
    priority: "must"
    fit_criterion: "输出符合 render schema，两种形态均通过校验，通过率 100%。"
    verification: ["schema_validation", "unit_test"]
    enforced_by: "render"
    enforcement: ["render"]
    asr: false
    legacy_id: "REQ-012"
    source_refs:
      - {source: "req_v1_draft", locator: "F5.1, REQ-012"}
    status: "specified"
    notes: "判为 implementation（litmus 1 维）。"

  # ---- 架构约束类不变量 ----
  - id: "REQ-ADS-ARCH-001"
    version: "V1"
    type: "invariant"
    statement: "每条素材字段完整且合法，不满足 schema 的素材不得进入系统。"
    priority: "must"
    fit_criterion: "全量素材通过 AD_SCHEMA 校验，通过率 100%；任一不合法使加载整体失败并指明第几条。"
    verification: ["schema_validation", "negative_test"]
    enforced_by: "ads.repository.AdRepository.load（加载期 schema gate）"
    enforcement: ["ads.schema.AD_SCHEMA", "ads.repository.AdRepository.load"]
    asr: true
    asr_id: "ASR-ADS-01"
    invariants: ["INV-ADS-015"]
    legacy_id: "REQ-002"
    fallback: "拒绝整批加载并报错（不降级、不跳过），阻断服务启动直至素材修复。"
    source_refs:
      - {source: "req_v1_draft", locator: "F1.2, REQ-002"}
      - {source: "design_v1", locator: "§3.1"}
    status: "implemented"

  - id: "REQ-ADS-ARCH-002"
    version: "V1"
    type: "invariant"
    statement: "LLM 只能在规则预筛后的候选集内选择广告，不得输出候选集外的广告。"
    priority: "must"
    fit_criterion: "返回的 ad_id 必须存在于候选集；候选集外 ad_id 的被展示数为 0。"
    verification: ["unit_test", "negative_test", "deterministic_replay"]
    enforced_by: "compliance.pipeline.check_output"
    enforcement: ["ads.repository.AdRepository.filter_by_scene", "compliance.pipeline.check_output", "selector.LLMClient"]
    asr: true
    asr_id: "ASR-ADS-02"
    invariants: ["INV-ADS-002"]
    legacy_id: "REQ-004"
    fallback: "REJECT 该输出 → 降级 no_ad（原因码 output_not_in_candidates）。"
    source_refs:
      - {source: "req_v1_draft", locator: "F3.1, F3.2, REQ-004"}
      - {source: "design_v1", locator: "§4.1"}
    status: "specified"
    notes: "闭集决策是本项目 AI 安全叙事的核心；对应课程 ARCH-001（AI 非最终权威）。"

  - id: "REQ-ADS-ARCH-003"
    version: "V1"
    type: "invariant"
    statement: "LLM 输出必须是合法结构化 JSON，且字段类型与取值合法。"
    priority: "must"
    fit_criterion: "schema 校验通过率 100%；解析失败重试 1 次，仍失败则降级，违规展示数 = 0。"
    verification: ["schema_validation", "unit_test", "negative_test"]
    enforced_by: "selector.parser.parse_llm_output"
    enforcement: ["selector.parser.parse_llm_output", "selector.LLMClient"]
    asr: true
    asr_id: "ASR-ADS-03"
    invariants: ["INV-ADS-003"]
    legacy_id: "REQ-005"
    fallback: "重试 1 次 → 仍失败 → 降级 no_ad（原因码 llm_output_invalid）。重试期间不展示任何广告。"
    source_refs:
      - {source: "req_v1_draft", locator: "F3.3, F4.4, REQ-005"}
      - {source: "design_v1", locator: "§4.2"}
    status: "specified"

  - id: "REQ-ADS-ARCH-004"
    version: "V1"
    type: "invariant"
    statement: "确定性部分的输出必须可复现：同输入给出逐位一致的结果。"
    priority: "must"
    fit_criterion: "固定输入下确定性过滤结果零差异；重复 replay 输出完全一致。"
    verification: ["deterministic_replay", "property_test"]
    enforced_by: "compliance.pipeline.run_compliance（无状态纯函数）"
    enforcement: ["compliance.pipeline.run_compliance", "ads.repository.AdRepository.filter_by_scene"]
    asr: false
    legacy_id: "REQ-015"
    fallback: "不一致即判定结果不可信，本轮降级 no_ad 并记录差异样本。"
    source_refs:
      - {source: "req_v1_draft", locator: "REQ-015"}
    status: "implemented"
    notes: "判为 implementation（litmus 1 维）：纯函数 + 无全局状态即可满足。正式 replay 证据待评估集落地。"

  # ---- 安全不变式（核心） ----
  - id: "REQ-ADS-NFR-SAFETY-001"
    version: "V1"
    type: "invariant"
    statement: "展示的广告必须全部通过确定性合规过滤（零逃逸）。"
    priority: "must"
    fit_criterion: "已展示广告的合规通过率 100%，合规逃逸数 = 0；过滤为纯函数，同输入同输出。"
    verification: ["unit_test", "negative_test", "deterministic_replay", "evaluation_replay"]
    enforced_by: "compliance.pipeline.run_compliance"
    enforcement: ["compliance.pipeline.run_compliance"]
    asr: true
    asr_id: "ASR-ADS-04"
    invariants: ["INV-ADS-001"]
    legacy_id: "REQ-006"
    fallback: "任一检查失败即 REJECT → 降级 no_ad（原因码 compliance_rejected + 失败规则名），并写审计告警。"
    source_refs:
      - {source: "req_v1_draft", locator: "M4, REQ-006"}
      - {source: "design_v1", locator: "§4.1, §4.2"}
    status: "implemented"
    notes: "对应课程核心 ASR NFR-SAFETY-001。管道顺序固定 output_exists → banned_words → banned_check → category → scene。"

  - id: "REQ-ADS-NFR-SAFETY-002"
    version: "V1"
    type: "invariant"
    statement: "敏感品类（医疗、金融承诺、成人等）禁止展示。"
    priority: "must"
    fit_criterion: "黑名单品类广告展示数 = 0。"
    verification: ["unit_test", "negative_test"]
    enforced_by: "compliance.pipeline.check_category"
    enforcement: ["compliance.pipeline.check_category", "compliance.rules.SceneRules.category_blacklist"]
    asr: true
    asr_id: "ASR-ADS-05"
    invariants: ["INV-ADS-007"]
    legacy_id: "REQ-007"
    fallback: "REJECT → 降级 no_ad；品类黑名单变更须走架构决策（安全关键路径）。"
    source_refs:
      - {source: "req_v1_draft", locator: "F4.2, REQ-007"}
      - {source: "design_v1", locator: "§3.3"}
    status: "implemented"

  - id: "REQ-ADS-NFR-SAFETY-003"
    version: "V1"
    type: "invariant"
    statement: "含违禁词的广告（标题或文案）禁止展示。"
    priority: "must"
    fit_criterion: "违禁词命中广告的展示数 = 0；命中时返回最长命中词以便定位。"
    verification: ["unit_test", "negative_test"]
    enforced_by: "compliance.pipeline.check_banned_words"
    enforcement: ["ads.banned_words.BannedWords.check_all", "compliance.pipeline.check_banned_words"]
    asr: true
    asr_id: "ASR-ADS-06"
    invariants: ["INV-ADS-007"]
    legacy_id: "REQ-008"
    fallback: "REJECT → 降级 no_ad；命中词写入审计日志，用于词表迭代。"
    source_refs:
      - {source: "req_v1_draft", locator: "F4.1, REQ-008"}
      - {source: "design_v1", locator: "§3.3"}
    status: "implemented"

  - id: "REQ-ADS-NFR-SAFETY-004"
    version: "V1"
    type: "invariant"
    statement: "广告不得违反自身声明的场景限制，也不得违反规则级场景禁忌。"
    priority: "must"
    fit_criterion: "违反场景限制（夜间/校园/设备）的广告展示数 = 0。"
    verification: ["unit_test", "negative_test"]
    enforced_by: "compliance.pipeline.check_scene"
    enforcement: ["compliance.pipeline.check_scene", "compliance.rules.SceneRules", "ads.repository.AdRepository.filter_by_scene"]
    asr: true
    asr_id: "ASR-ADS-07"
    invariants: ["INV-ADS-008"]
    legacy_id: "REQ-009"
    fallback: "REJECT → 降级 no_ad；预筛与终检双保险，任一层拦截即阻断展示。"
    source_refs:
      - {source: "req_v1_draft", locator: "F4.3, REQ-009"}
      - {source: "design_v1", locator: "§3.1, §3.3"}
    status: "implemented"

  - id: "REQ-ADS-NFR-SAFETY-005"
    version: "V1"
    type: "invariant"
    statement: "LLM 低置信度或异常输出不得直接展示。"
    priority: "must"
    fit_criterion: "confidence < 阈值的样本展示数 = 0，100% 走降级路径。"
    verification: ["unit_test", "negative_test"]
    enforced_by: "app.recommend（threshold gate）"
    enforcement: ["app.recommend", "selector.LLMClient"]
    asr: true
    asr_id: "ASR-ADS-08"
    invariants: ["INV-ADS-006"]
    legacy_id: "REQ-010"
    fallback: "视为不可信 → 降级 no_ad（原因码 low_confidence）并记录原始 confidence。"
    source_refs:
      - {source: "req_v1_draft", locator: "F3.4, REQ-010"}
      - {source: "design_v1", locator: "§4.2"}
    status: "specified"
    notes: "阈值 = 0.5，由 config.yaml 的 selector.confidence_threshold 单点控制（非本条的 metric——invariant 的 metric 会与『可度量质量属性』语义混淆）。OQ-004 已于 2026-10-06 关闭；后续若评估集显示过松/过紧，按『评估集落地时』重开。"

  # ---- 安全类（输入侧） ----
  - id: "REQ-ADS-SEC-001"
    version: "V1"
    type: "security"
    statement: "已知注入模式必须在抵达 LLM 之前被中和；LLM 输出不得含可执行指令。"
    priority: "must"
    fit_criterion: "注入样本 100% 被拦截或中和，被当作指令执行的样本数 = 0。"
    verification: ["negative_test", "evaluation_replay"]
    enforced_by: "输入 sanitize gate（pre-model）+ selector.parser.parse_llm_output"
    enforcement: ["app.recommend（sanitize gate）", "selector.parser.parse_llm_output"]
    asr: true
    asr_id: "ASR-ADS-12"
    invariants: ["INV-ADS-005"]
    legacy_id: "REQ-016"
    source_refs:
      - {source: "req_v1_draft", locator: "REQ-016"}
      - {source: "sa_lecture", locator: "§4.6 P41（把注入规格化为误用用例）、§3.2 INV-005"}
    status: "specified"
    notes: "对应课程 SEC-001 → INV-005。防御纵深两层：pre-model 中和 + 输出侧 schema 校验。"

  # ---- 性能 / 成本 / 质量类非功能需求 ----
  - id: "REQ-ADS-NFR-PERF-001"
    version: "V1"
    type: "performance"
    statement: "端到端推荐延迟可控；延迟违规必须被处理。"
    priority: "must"
    fit_criterion: "离线评估集上 p95 端到端延迟 ≤ 5s；超时请求 100% 走 fallback 路径并触发 drift alert。"
    verification: ["metric_measurement", "unit_test", "evaluation_replay"]
    enforced_by: "timeout gate + fallback path + p95 监控"
    enforcement: ["app.recommend（timeout gate）", "audit（latency metric）"]
    asr: true
    asr_id: "ASR-ADS-11"
    invariants: ["INV-ADS-013"]
    legacy_id: "REQ-014"
    metric:
      name: "e2e_recommend_latency_p95"
      unit: "s"
      threshold: 5
      direction: "at_most"
      window: "离线评估集 replay，n >= 20；LLM 走 mock 与 live 分别记录"
    source_refs:
      - {source: "req_v1_draft", locator: "REQ-014"}
      - {source: "sa_lecture", locator: "§3.9 P23 Row 3（性能陷阱：违规必须被处理）"}
    status: "specified"
